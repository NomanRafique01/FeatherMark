# FeatherMark — Windows NSIS packaging.
# The checked-in ICO contains 16/24/32/48/64/128/256px layers so Windows
# does not have to blur a single raster for shortcuts or taskbar icons.
appId: com.feathermark.app
productName: FeatherMark
# Keep the package description short: Windows uses the executable's
# FileDescription as the display name in the "Open with" app picker.
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - store/**
  - renderer/index.html
  - renderer/tokens.css
  - renderer/style.css
  - renderer/dist/**
  - assets/icon.png
  - assets/icon.ico
  - assets/fileicon.ico
  - package.json
win:
  icon: assets/icon.ico
  fileAssociations:
    - ext:
        - md
        - markdown
        - mdown
        - mkdn
        - mkd
        - mdwn
      name: FeatherMark.Markdown
      description: FeatherMark
      # This is installed into $INSTDIR\resources and registered as the
      # Markdown ProgID's DefaultIcon. Keep the executable/installer icon
      # above on assets/icon.ico.
      icon: assets/fileicon.ico
  target:
    - nsis
nsis:
  # Use electron-builder's assisted-installer template unchanged. Overriding it
  # with `script:` skips the uninstaller build pass, which leaves the installer
  # without an uninstaller and fails the NSIS compile.
  #   - build/feathermark-custom.nsh makes the extraction details visible and
  #     cleans the legacy ProgID created by early FeatherMark installers.
  #   - scripts/patch-nsis-extraction.mjs streams each extracted file name.
  include: build/feathermark-custom.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FeatherMark
  # Full uninstall removes FeatherMark's per-user settings and session data.
  # Upgrades remain safe: electron-builder only passes --delete-app-data for
  # a real uninstall, not when replacing an existing installation.
  deleteAppDataOnUninstall: true
  runAfterFinish: true
