# FeatherMark — Windows NSIS packaging.
# The checked-in ICO contains 16/24/32/48/64/128/256px layers so Windows
# does not have to blur a single raster for shortcuts or taskbar icons.
appId: com.feathermark.app
productName: FeatherMark
# The exe's FileDescription version string is what the Windows shell shows as
# the app name in "Open with" / default-app lists; build/afterPack.js pins it
# to "FeatherMark" instead of the long package.json description.
afterPack: build/afterPack.js
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - store/**
  - renderer/index.html
  - renderer/tokens.css
  - renderer/style.css
  - renderer/dist/**
  - assets/icon.png
  - assets/icon.ico
  - package.json
win:
  icon: assets/icon.ico
  fileAssociations:
    - ext:
        - md
        - markdown
        - mdown
        - mkdn
        - mkd
        - mdwn
      name: Markdown document
      description: Markdown document
      icon: assets/icon.ico
  target:
    - nsis
nsis:
  # build/installer.nsh renames the registered ProgID friendly name to
  # "FeatherMark" and drops a stale one inherited from an older tool.
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FeatherMark
  deleteAppDataOnUninstall: false
  runAfterFinish: true
