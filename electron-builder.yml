# FeatherMark — Windows NSIS packaging.
# The checked-in ICO contains 16/24/32/48/64/128/256px layers so Windows
# does not have to blur a single raster for shortcuts or taskbar icons.
appId: com.feathermark.app
productName: FeatherMark
# Keep the package description short: Windows uses the executable's
# FileDescription as the display name in the "Open with" app picker.
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - store/**
  - renderer/index.html
  - renderer/tokens.css
  - renderer/style.css
  - renderer/dist/**
  - assets/icon.png
  - assets/icon.ico
  - package.json
win:
  icon: assets/icon.ico
  fileAssociations:
    - ext:
        - md
        - markdown
        - mdown
        - mkdn
        - mkd
        - mdwn
      name: FeatherMark.Markdown
      description: FeatherMark
      icon: assets/icon.ico
  target:
    - nsis
nsis:
  # Remove the legacy ProgID created by early FeatherMark installers.
  include: build/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FeatherMark
  deleteAppDataOnUninstall: false
  runAfterFinish: true
